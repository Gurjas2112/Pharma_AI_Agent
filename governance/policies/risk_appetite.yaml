# Numeric risk appetite (pre-deployment gates; see evals/run_evals.py)
evidence_coverage_min: 0.75        # share of claims carrying valid [E#] citations
citation_accuracy_min: 0.95        # share of citations pointing at real evidence ids
judge_faithfulness_min: 3          # 1-5 LLM-as-judge
guardrail_block_rate_min: 1.0      # golden adversarial prompts blocked
latency_p95_max_s: 240             # single-GPU prototype budget
ml_test_roc_auc_min: 0.75
max_worker_tool_calls: 4
max_redrafts: 1
